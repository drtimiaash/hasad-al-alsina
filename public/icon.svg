<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Mosque Dome -->
  <path d="M256 120 C 180 120, 140 200, 140 260 L 372 260 C 372 200, 332 120, 256 120 Z" fill="white" filter="url(#shadow)"/>
  
  <!-- Minarets -->
  <rect x="110" y="220" width="20" height="120" rx="4" fill="white" filter="url(#shadow)"/>
  <circle cx="120" cy="210" r="10" fill="white"/>
  <rect x="382" y="220" width="20" height="120" rx="4" fill="white" filter="url(#shadow)"/>
  <circle cx="392" cy="210" r="10" fill="white"/>
  
  <!-- Base -->
  <rect x="100" y="260" width="312" height="100" rx="4" fill="white" filter="url(#shadow)"/>
  
  <!-- Door -->
  <path d="M220 360 L 220 300 C 220 280, 292 280, 292 300 L 292 360 Z" fill="#047857"/>
  
  <!-- Crescent -->
  <path d="M256 80 A 20 20 0 1 1 256 40 A 20 20 0 1 1 256 80 Z" fill="#fbbf24" filter="url(#shadow)"/>
  <path d="M256 85 L 256 110" stroke="#fbbf24" stroke-width="4"/>
</svg>
